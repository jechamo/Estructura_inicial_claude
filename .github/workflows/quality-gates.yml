# Gates de calidad — el equivalente automático de AGENTS.md §7.
#
# PLANTILLA: adapta los comandos a tu stack durante /sdd-init.
# Lo que no se automatiza aquí, se olvida.

name: Quality Gates

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lo barato primero: falla rápido.
  static:
    name: Lint · formato · tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formato
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck

  test:
    name: Tests · cobertura
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unitarios y de integración con cobertura
        run: npm run test:coverage
      - name: Sin tests saltados en la rama principal
        run: |
          if grep -rEn "\.(only|skip)\(" --include="*.test.*" --include="*.spec.*" .; then
            echo "::error::Hay tests con .only o .skip"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  contracts:
    name: Tests de contrato
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Contratos
        run: npm run test:contract --if-present

  security:
    name: Seguridad · dependencias y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high
      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  traceability:
    name: Trazabilidad SDD
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Los commits referencian spec y tarea
        run: |
          # Formato esperado: tipo(NNN): descripción — task T-NNN-XX
          patron='^(feat|fix|refactor|perf|test|docs|build|ci|chore)(\([0-9]{3}\))?!?: .+'
          fallos=0
          while read -r sha asunto; do
            if ! echo "$asunto" | grep -qE "$patron"; then
              echo "::warning::Commit $sha no sigue Conventional Commits: $asunto"
              fallos=$((fallos+1))
            fi
          done < <(git log --format='%h %s' origin/${{ github.base_ref }}..HEAD)
          echo "Commits fuera de formato: $fallos"

      - name: La rama tiene una spec asociada
        run: |
          rama="${{ github.head_ref }}"
          id=$(echo "$rama" | grep -oE '[0-9]{3}' | head -1)
          if [ -z "$id" ]; then
            echo "::warning::La rama '$rama' no lleva id de spec (feature/NNN-slug)"
            exit 0
          fi
          if ! ls -d docs/specs/${id}-* >/dev/null 2>&1; then
            echo "::error::No existe docs/specs/${id}-* para la rama '$rama'"
            exit 1
          fi
          echo "Spec encontrada: $(ls -d docs/specs/${id}-*)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, contracts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
