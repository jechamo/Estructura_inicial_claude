# CI exclusivo del repositorio de la plantilla. El instalador no copia este workflow.
name: Template quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-runtime:
    name: Node ${{ matrix.node }} · installer and contracts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/check-sdd.mjs
      - run: node scripts/test-hooks.mjs
      - run: node scripts/test-install.mjs
      - run: node scripts/skills-sync.mjs --check

  strict:
    name: Strict SDD evidence · spec ${{ matrix.spec }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spec: ['002', '004', '005', '006', '007', '008']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/check-sdd.mjs --strict --spec ${{ matrix.spec }}

  documentation:
    name: Documentation diff · exact base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Validate documentation against exact PR base
        env:
          SDD_DOCS_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-sdd.mjs --docs-diff --base "$SDD_DOCS_BASE"
