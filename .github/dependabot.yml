version: 2

updates:
  # Las actions son código de terceros con acceso a tu CI: fíjalas y actualízalas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    groups:
      # Agrupa lo menor para no ahogar el repo en PRs. Lo mayor se revisa una a una.
      minor-and-patch:
        update-types: [minor, patch]

  # Descomenta el que use tu proyecto.
  # - package-ecosystem: pip
  #   directory: /
  #   schedule:
  #     interval: weekly
  # - package-ecosystem: docker
  #   directory: /
  #   schedule:
  #     interval: weekly
